services:
  backend:
    build:
      context: ./backend
    image: khalid7730/intrusion-api:latest
    platform: linux/amd64
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      AWS_MODEL_KEY: ${AWS_MODEL_KEY}
      AWS_LOCAL_MODEL_PATH: ${AWS_LOCAL_MODEL_PATH}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_SSL: ${REDIS_SSL}
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: